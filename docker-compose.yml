# Local development: Postgres for the agent's data and Keycloak for SSO.
#   npm run db:up    → Postgres on localhost:5434, Keycloak on http://localhost:8081 (admin / admin)
name: ai-sales-agent

services:
  db:
    image: postgres:17
    container_name: ai-sales-agent-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5434:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: ai-sales-agent-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  agent_pgdata:
